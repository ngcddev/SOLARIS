<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Offline — Solaris</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #000; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
    main { max-width: 28rem; padding: 1.5rem; }
    h1 { font-size: 1.75rem; margin: 0 0 1rem; }
    a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1rem; border: 2px solid #000; border-radius: 6px; color: #000; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Solaris could not reach the network. Pages you opened before are still available. Help requests are never stored in this offline cache: they are sent as soon as the connection returns.</p>
    <p>If you are in danger, call your local emergency number.</p>
    <a href="/citizen">Back to the citizen simulator</a>
  </main>
</body>
</html>
